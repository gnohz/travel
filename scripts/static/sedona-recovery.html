<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f6f2"><title>恢复打开｜Sedona 2026</title>
  <style>*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#353b31;font:17px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:620px;margin:8vh auto;padding:28px}small{letter-spacing:.12em;color:#717469}h1{font-size:28px}a{color:#92412d}button{font:inherit;background:#a44c34;color:white;border:0;border-radius:8px;padding:12px 22px;cursor:pointer}button:disabled{opacity:.6}#status{min-height:32px}.secondary{border-top:1px solid #deded5;margin-top:30px;padding-top:18px}</style>
</head>
<body><main>
  <small>SEDONA 2026</small><h1>恢复打开旅行指南</h1>
  <p>如果主屏幕图标一直白屏，请保持联网，点下面的按钮重新加载指南。</p>
  <p><button id="repair" type="button">修复并打开</button></p>
  <p id="status" role="status" aria-live="polite"></p>
  <p><a href="./sedona-2026/">直接打开网站首页</a> · <a href="./sedona-2026/sedona-2026-guide.pdf" download="Sedona-2026-guide.pdf">下载 PDF 指南</a></p>
  <div class="secondary"><p>如果 Safari 能打开，但旧的主屏幕图标仍然白屏：</p>
    <ol><li>移除旧的 Sedona 主屏幕图标。</li><li>用 Safari 打开上方“网站首页”。</li><li>点“分享 → 添加到主屏幕”，重新添加。</li></ol>
    <p>重新添加后，等网站显示“离线已就绪”。这会重新下载离线内容；不会修改旅行行程。</p>
  </div>
</main><script>
(function () {
  var base = '/travel/sedona-2026/';
  var button = document.getElementById('repair');
  var status = document.getElementById('status');
  button.addEventListener('click', function () {
    if (!navigator.onLine) { status.textContent = '请先连接网络，再试一次。'; return; }
    button.disabled = true; status.textContent = '正在恢复打开，请稍候…';
    // This page is deliberately outside the app's service worker scope, so even
    // old workers that return the HTML shell for every navigation cannot trap it.
    Promise.resolve().then(function () {
      return fetch(base + 'index.html?recovery=' + Date.now(), { cache: 'no-store' });
    }).then(function (response) {
      if (!response.ok) throw new Error('Website unavailable');
      return 'serviceWorker' in navigator ? navigator.serviceWorker.getRegistrations() : [];
    }).then(function (registrations) {
      return Promise.all(registrations.filter(function (r) { return new URL(r.scope).origin === location.origin && new URL(r.scope).pathname === base; }).map(function (r) { return r.unregister(); }));
    }).then(function () {
      return 'caches' in window ? caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (key) { return key.indexOf('sedona-2026-') === 0; }).map(function (key) { return caches.delete(key); }));
      }) : undefined;
    }).then(function () { location.replace(base + '?recovered=' + Date.now()); })
      .catch(function () { button.disabled = false; status.textContent = '暂时未能恢复，请检查网络后重试，或用 Safari 直接打开网站首页。'; });
  });
})();
</script></body></html>
